K1:
  choice: '1'
  reason: KPI の文の順のとおり、町全体の定時配達を主目標にし、どの会社の顧客もひどく待たせないことは、会社ごとの待ち時間の 95 パーセンタイルで監視する。「ひどく」の水準は、第
    1 期の測定を見てから決める。
  assumptions:
  - 顧客は配送の会社を選べない
D1:
  choice: '1'
  reason: 交差点は 3 社が共有する道路で、そこで待ち続けることはどの会社の権利でもない。5 つのシードすべてで定時配達が増え、遅配が 10.4 件から
    1.2 件に、最も待たせた会社の待ち時間の 95 パーセンタイルが 273 秒から 95.6 秒に下がるので、B・C 社の反対を覆して採る。C 社の効用が
    28.8 から 19.0 に下がることと、道路の違反が 25.8 から 34.0 に増えることは、次の期にもう一度測る。
D2:
  choice: keep
  reason: 投票は A・B 社の賛成で定足数に届いているので、採っても覆すことにはならない。それでも、改善したのは 5 つのシードのうち 2 つだけで、確かでない改善のために
    C 社の効用を 56.3 から 40.1 に下げることはしない。最も待たせた会社の待ち時間の 95 パーセンタイルは 109 秒で、約束の 120 秒の内にある。
K5:
  choice: '1'
  reason: 閑散期は遅配がほとんどないので、各社の協力を保つため、会社ごとの効用の差を縮めることを主目標にする。差だけを縮めて定時率や最も低い会社の定時率、待ち時間が悪化する改正は、監視する目標で見つけ、そのつど判断する。D1
    の block_k の改正が C 社に損をさせていないかも、この評価方法で測り直す。
D5:
  choice: keep
  reason: block_k を 3 に戻す案（1）と罰点をなくす案（3）は、効用の差を縮めるが、遅配が 1.8 件から 7.8 件・6.6 件に増え、最も低い会社の定時率も下がる。差を縮めるためにサービスを悪くすることはしない。罰点をなくす案は、道路の違反もほぼ倍になる。hold_limit
    の案（2）は C 社の効用を 1.3 しか上げず、最も待たせた会社の待ち時間の 95 パーセンタイルを、約束の 120 秒を超えた 178 秒からさらに 212
    秒に延ばす。C 社の効用が低い原因は、閑散期にもう一度測って考える。
