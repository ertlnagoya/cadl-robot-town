# Answers to the decision requests of a real run with Claude Opus 5.5 (2026-11-16).
# The human (operator) role was played by Claude when this record was made. To answer
# yourself, drop --answers and answer in the terminal, or edit this file.
K1:
  choice: "1"
  reason: Follow the order of the KPI. Town-wide on-time deliveries are the main goal, and the worst company's on-time rate has a floor. The floor of 0.7 is provisional and will be revisited once period 1 is measured.
  assumptions:
    - Customers cannot choose which company delivers their order
D1:
  choice: "2"
  reason: The intersections are a road shared by the three companies; waiting there is no company's right. Late deliveries fall from 10.4 to 1.2 and the worst company's on-time rate rises to 0.98, so adopt it against B's and C's votes. Re-measure C's utility (28.8 to 19.0) and the road violations next period. The constitutional floor (R1) can wait; it changes nothing now.
  assumptions:
    - B and C keep delivering in the town after the rules change
D2:
  choice: keep
  reason: A and B vote for it, so it reaches the quorum of two and needs no override. But it improves on only 2 of 5 seeds, and C's utility would fall from 56.3 to 40.1. Do not make an uncertain change at C's cost.
K5:
  choice: "1"
  reason: In the quiet season, keep the companies cooperating; the main goal is narrowing the spread of utility, with a floor on the worst company's on-time rate so that the spread cannot be narrowed by making service worse. Keep the floor of 0.9 until the quiet season has been measured once.
D5:
  choice: "3"
  reason: It is the only option that narrows the utility spread while keeping the 0.9 floor, and A and C make the quorum. Reverting D1 or removing sanctions narrows the spread by making service worse (lowest on-time rate 0.83 and 0.89), which the floor was set to prevent.
D6:
  choice: keep
  reason: The spread narrows by only 1.6, and only because A and B lose a little while C gains a little; customers get slightly worse service (the worst on-time rate falls from 0.97 to 0.94). One step toward fairness was taken in D5. Keep the rules until the quiet season shows a change that narrows the spread without costing customers.
