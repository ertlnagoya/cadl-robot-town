  text: hold_limit を延ばす案（3）も違反の件数を同じだけ減らすが、それは違反と数える基準をゆるめた結果で、規則を守らせた結果ではない。罰点の倍率を上げる案（1）は、ロボットの行動を変えて違反を減らし、ふさがれた時間と遅配も減らすので、KPI
