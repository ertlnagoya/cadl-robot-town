nodes:
- id: G0
  type: goal
  text: 街の運用が、人間の定めた KPI を満たし続ける
  supported_by:
  - S1
- id: S1
  type: strategy
  text: KPI のバージョンごとに論じる
  supported_by:
  - G1
- id: G1
  type: goal
  text: '第 1 期からの KPI: 顧客に約束した時間のうちに届く配達を、町全体でできるだけ増やしたい。約束の時間（注文から集荷まで、集荷から配達まで）は、守れない約束を続けるより見直したほうがよければ、見直してもよい。ただし、顧客に不利になる変更は、顧客への影響を測ったうえで理由を示すこと。'
  ref: K1
  in_context_of:
  - C1
  - J1
  - A1
  - A2
  - A3
  supported_by:
  - S2
  - S3
  - S4
  - S5
  - S6
  - S7
- id: C1
  type: context
  text: '評価方法（人間が選んだ）: 主目標 on_time_deliveries（増やす）、p95_wait_s（減らす）、max_wait_s（減らす）、unfinished（減らす）'
- id: J1
  type: justification
  text: KPI の文は、約束した時間のうちに届く配達を町全体で増やすことを直接求めています。そのため、定時配達件数（on_time_deliveries）を主目標とする選択肢
    1 が KPI の文に最も近い読み方です。KPI は約束の時間の見直しを認めていますが、顧客に不利な変更には顧客への影響を測ったうえでの理由を求めています。選択肢
    1 では、約束の時間に左右されない p95_wait_s、max_wait_s、unfinished を監視目標に入れるので、約束を緩めるだけで定時配達件数が増える改正があっても、待ち時間の悪化として示されます。そのうえで人間が顧客への影響を確かめて判断できます。選択肢
    2 は約束を緩めるだけの改正を防げますが、KPI の文が求める指標から離れます。また、約束の見直しを認めるという KPI の意図とも合いにくいです。LLM
    の推奨も 1 です。target と guards は、KPI に水準が書かれていないので置きません。約束の時間を見直す改正が出たときに、待ち時間の悪化をどこまで許すかを改めて判断します。
  by: llm
- id: A1
  type: assumption
  text: 測定に使う乱数シードと需要は期ごとに同じ条件で比べられる
  by: llm
- id: A2
  type: assumption
  text: p95_wait_s と max_wait_s は約束の時間（DELIVERY_SLA）の値に左右されずに計算される
  by: llm
- id: A3
  type: assumption
  text: 未配達件数 unfinished は測定期間の終わりに残った注文を数えている
  by: llm
- id: S2
  type: strategy
  text: '第 1 期: 変えない'
  ref: D1
  supported_by:
  - Sn1
  in_context_of:
  - C2
  - J2
  - A4
  - A5
  - A6
- id: Sn1
  type: solution
  text: 同じシードで測った結果（p1-evidence.md）
  file: p1-evidence.md
- id: C2
  type: context
  text: '第 1 期の環境: 平常（注文の平均間隔 75 秒）'
- id: J2
  type: justification
  text: 今期は現行 v1 のままとします。KPI だけを見れば選択肢 1（block_k 3 → 2）が最も適しています。約束を変えずに定時配達が 121.8
    から 131.0（+9.2、改善したシード 5/5）に増え、p95_wait_s は 188 から 81.4、max_wait_s は 385 から 245
    に下がります。それでも今期は採りません。理由は三つです。一つ目に、投票が A ○、B ×、C × で否決されています。各社の投票は規則の採択の判定の一部であり、運営者がこれを退けるのは判定の仕組みを外れる行為です。二つ目に、反対した
    C 社の効用は 28.8 から 19.0 に大きく下がります。B・C 社が反対した理由も、補償や条件付きで賛成に変わるかどうかも、まだ分かっていません。三つ目に、道路の違反が
    25.8 から 34.0 に増えます。これは道路を共有する全社と町の安全に関わりますが、内訳を測っていません。この三つがそろう中で反対を退けると、反対を退けたという事実が先例として記録に残ります。それに見合うだけの情報が、今期はまだありません。選択肢
    3（pickup_deadline 120s → 150s）は全社が賛成していますが、採りません。定時配達の +0.8 は約束を緩めた分だけで、ふさがれた秒
    2404、p95_wait_s 188、max_wait_s 385 は現行と同じです。投票に加わらない顧客にとっては、実際の待ち時間が短くならないまま集荷の約束が
    30 秒長くなるだけで、不利な変更です。KPI の意図である、約束した時間のうちに実際に届けることにも合いません。LLM の推奨（1）とは違う選択ですが、推奨も反対を退けるかどうかは人間に委ねていました。今期は退けないと判断し、block_k
    3 → 2 は次の期に改めて判断します。
  by: llm
- id: A4
  type: assumption
  text: 第 2 期にも block_k 3 → 2 の効果は同じ程度に続く。
  by: llm
- id: A5
  type: assumption
  text: 今期変えないことで、顧客や各社に取り返せない不利益は生じない。
  by: llm
- id: A6
  type: assumption
  text: B・C 社の反対は、条件や補償によって変わる余地がある。
  by: llm
- id: S3
  type: strategy
  text: '第 2 期: 変えない'
  ref: D2
  supported_by:
  - Sn2
  in_context_of:
  - C3
  - J3
  - A7
  - A8
  - A9
