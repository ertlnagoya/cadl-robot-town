  type: solution
  text: 同じシードで測った結果（p2-evidence.md）
  file: p2-evidence.md
- id: C3
  type: context
  text: '第 2 期の環境: 平常＋ラッシュ（注文の平均間隔 75 秒）'
- id: J3
  type: justification
  text: 今期も現行 v1 のままとします。KPI だけを見れば案 1（block_k 3 → 2）が最も適しています。約束の時間を変えずに、定時配達が 216.6
    から 223.8 に増え（+7.2、改善したシード 5/5）、遅配は 11.4 から 4.2、p95_wait_s は 138 から 110、max_wait_s
    は 411 から 201 に下がります。それでも採らない理由は、第 1 期（D1）に採らなかった三つの理由が今期もすべて残っているためです。一つ目に、投票は今期も
    A ○、B ×、C × で否決されています。各社の投票は採択の判定の一部であり、運営者がこれを退けると先例として記録に残ります。二つ目に、C 社の効用は 65.8
    から 56.3 に大きく下がり、B 社も 68.5 から 65.5 に下がります。反対の理由や、条件付きで賛成に変わるかどうかは分かっていません。三つ目に、道路の違反が
    19.0 から 28.0 に増えます。これは道路を共有する全社と町の安全に関わりますが、内訳は今期も測っていません。前期の判断を変えるだけの新しい情報がない中で反対を退けると、判断の一貫性がありません。LLM
    の推奨（keep）と同じ選択で、投票の結果とも一致します。ただし、顧客は遅配の減少（11.4 から 4.2）と待ち時間の短縮（max_wait_s 411
    から 201）を 2 期続けて得られません。顧客は投票に加わらないので、この不利益は記録に残します。違反の内訳などの新しい情報が得られた期には、反対を退けることも改めて検討します。表の案
    2（hold_limit 60s → 50s）は選択肢にありませんが、主目標の差が +0.4（改善したシード 2/5）と小さく、C 社が反対しています。この判断で
    D1.f1 の問いに答えます。答えは、今期は B・C 社の反対を退けない、です。
  by: llm
- id: A7
  type: assumption
  text: 次の期の需要と乱数シードの条件でも、現行 v1 の定時率と unfinished が大きく悪化しないこと。
  by: llm
- id: A8
  type: assumption
  text: 表の測った値は、各社が走行方針を変えない前提で正しいこと。
  by: llm
- id: A9
  type: assumption
  text: 道路の違反の増加（19.0 から 28.0）に、安全に関わる重い違反が含まれている可能性を否定できないこと。
  by: llm
- id: S4
  type: strategy
  text: '第 3 期: v2 hold_limit 60s → 50s（規則、主目標 +2.2，賛成 AB）'
  ref: D3
