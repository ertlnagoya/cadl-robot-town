- id: C4
  type: context
  text: '第 3 期の環境: 繁忙期（注文の平均間隔 45 秒）'
- id: J4
  type: justification
  text: '案 2（hold_limit 60s → 50s）を採ります。各社の投票で可決されており（A ○、B ○、C ×）、反対を退けずに採択できます。約束の時間を変えずに、定時配達は
    213.6 から 215.8（+2.2、改善したシード 4/5）、遅配は 9.2 から 7.0、p95_wait_s は 130 から 121 になり、最低の定時率は
    0.93 から 0.95 に上がります。顧客が 3 期続けて改善を得られない状態を、反対を退けずに一部解消できます。


    D2.f1 の問いには、今期も B・C 社の反対を退けない、と答えます。今期は投票が否決のままで、違反の内訳も分からないため、問いの条件に当たります。顧客の不利益が続くことは重く見ていますが、反対を退けない理由は次の四つです。一つ目に、案
    1 の根拠は前 2 期より弱くなっています。改善したシードは 3/5 で、前 2 期の 5/5 より少なく、主目標の差も +5.8 で、D1 の +9.2、D2
    の +7.2 より小さくなっています。二つ目に、C 社の効用の低下は 58.3 から 46.9（-11.4）で、前期の -9.5 より大きくなっています。三つ目に、道路の違反は
    24.2 から 34.8 に増えますが、原因別の内訳は今期も表に載っていません。四つ目に、今期は投票で可決される案 2 があり、退けなくても顧客の不利益を一部減らせます。D1・D2
    で示した、新しい情報が得られれば改めて検討するという条件は、今期も満たされていません。この判断は LLM の推奨と同じで、投票の結果とも一致します。


    案 2 の不利な点も記録に残します。ふさがれた秒は 1888 から 2005、max_wait_s は 236 から 239、道路の違反は 24.2 から
    29.0 に増え、C 社の効用は 58.3 から 54.2 に下がります。最も長く待つ顧客の待ち時間は 3 秒延びます。そのため、次の期にこれらを監視します。顧客は投票に加わらないので、案
    1 の遅配の減少（9.2 から 3.4）と p95_wait_s の短縮（130 から 93.2）を今期も得られないことを記録に残します。


    あわせて K1.d.f1 の問いにも答えます。約束の時間（DELIVERY_SLA）を緩める改正では、p95_wait_s と max_wait_s が現行より悪化しないこと（同じか改善）を水準とします。約束を緩めるだけで実際の待ち時間が短くならない改正は、顧客に不利なため採りません。これは
    D1 で pickup_deadline 120s → 150s を採らなかった理由と同じ考え方です。'
  by: llm
- id: A10
  type: assumption
  text: 案 2 の測定値（同じ乱数シードと需要）が、採択後の第 4 期にもおおむね当てはまる
  by: llm
- id: A11
  type: assumption
  text: 案 2 による道路の違反の増加（+4.8）は、町の安全を大きく損なう種類の違反ではない
  by: llm
- id: A12
