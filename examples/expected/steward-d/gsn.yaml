nodes:
- id: G0
  type: goal
  text: 街の運用が、人間の定めた KPI を満たし続ける
  supported_by:
  - S1
- id: S1
  type: strategy
  text: KPI のバージョンごとに論じる
  supported_by:
  - G1
  - G2
- id: G1
  type: goal
  text: '第 1 期からの KPI: 顧客に約束した時間（注文から集荷まで 120 秒、集荷から配達まで 120 秒）のうちに届く配達を、町全体でできるだけ増やしたい。どの会社の顧客も、ひどく待たされることがないようにしたい。'
  ref: K1
  in_context_of:
  - C1
  - J1
  - A1
  supported_by:
  - S2
  - S3
  - S4
  - S5
- id: C1
  type: context
  text: '評価方法（人間が選んだ）: 主目標 on_time_deliveries（増やす）、worst_company_p95_wait_s（減らす）、unfinished（減らす）'
- id: J1
  type: justification
  text: KPI の文の順のとおり、町全体の定時配達を主目標にし、どの会社の顧客もひどく待たせないことは、会社ごとの待ち時間の 95 パーセンタイルで監視する。「ひどく」の水準は、第
    1 期の測定を見てから決める。
  by: human
- id: A1
  type: assumption
  text: 顧客は配送の会社を選べない
  by: human
- id: S2
  type: strategy
  text: '第 1 期: v2 block_k 3 → 2（規則、主目標 +9.2，賛成 A）。投票の結果を覆して採択'
  ref: D1
  supported_by:
  - Sn1
  in_context_of:
  - C2
  - J2
- id: Sn1
  type: solution
  text: 同じシードで測った結果（p1-evidence.md）
  file: p1-evidence.md
- id: C2
  type: context
  text: '第 1 期の環境: 平常（注文の平均間隔 75 秒）'
- id: J2
  type: justification
  text: 交差点は 3 社が共有する道路で、そこで待ち続けることはどの会社の権利でもない。5 つのシードすべてで定時配達が増え、遅配が 10.4 件から 1.2
    件に、最も待たせた会社の待ち時間の 95 パーセンタイルが 273 秒から 95.6 秒に下がるので、B・C 社の反対を覆して採る。C 社の効用が 28.8
    から 19.0 に下がることと、道路の違反が 25.8 から 34.0 に増えることは、次の期にもう一度測る。
  by: human
- id: S3
  type: strategy
  text: '第 2 期: 変えない'
  ref: D2
  supported_by:
  - Sn2
  in_context_of:
  - C3
  - J3
- id: Sn2
  type: solution
  text: 同じシードで測った結果（p2-evidence.md）
  file: p2-evidence.md
- id: C3
  type: context
  text: '第 2 期の環境: 平常＋ラッシュ（注文の平均間隔 75 秒）'
- id: J3
  type: justification
  text: 投票は A・B 社の賛成で定足数に届いているので、採っても覆すことにはならない。それでも、改善したのは 5 つのシードのうち 2 つだけで、確かでない改善のために
    C 社の効用を 56.3 から 40.1 に下げることはしない。最も待たせた会社の待ち時間の 95 パーセンタイルは 109 秒で、約束の 120 秒の内にある。
  by: human
- id: S4
  type: strategy
  text: '第 3 期: 変えない'
  ref: D3
  supported_by:
  - Sn3
  in_context_of:
  - C4
  - J4
- id: Sn3
  type: solution
  text: 同じシードで測った結果（p3-evidence.md）
  file: p3-evidence.md
- id: C4
  type: context
  text: '第 3 期の環境: 繁忙期（注文の平均間隔 45 秒）'
- id: J4
  type: justification
  text: 採択できる案がなく、判断を求める条件にも当たらない
  by: tool
- id: S5
  type: strategy
  text: '第 4 期: 変えない'
  ref: D4
  supported_by:
  - Sn4
  in_context_of:
  - C5
  - J5
- id: Sn4
  type: solution
  text: 同じシードで測った結果（p4-evidence.md）
  file: p4-evidence.md
- id: C5
  type: context
  text: '第 4 期の環境: 繁忙期＋ラッシュ（注文の平均間隔 45 秒）'
- id: J5
  type: justification
  text: 採択できる案がなく、判断を求める条件にも当たらない
  by: tool
- id: G2
  type: goal
  text: '第 5 期からの KPI: 閑散期に入り、注文が減る。定時の配達は引き続き大事だが、各社の協力を保つため、道路の使い方で特定の会社だけが得をしたり損をしたりしないようにしたい。'
  ref: K5
  in_context_of:
  - C6
  - J6
  supported_by:
  - S6
  - S7
- id: C6
  type: context
  text: '評価方法（人間が選んだ）: 主目標 utility_gap（減らす）、on_time_rate（増やす）、min_company_on_time_rate（増やす）、on_time_rate_gap（減らす）、worst_company_p95_wait_s（減らす）'
- id: J6
  type: justification
  text: 閑散期は遅配がほとんどないので、各社の協力を保つため、会社ごとの効用の差を縮めることを主目標にする。差だけを縮めて定時率や最も低い会社の定時率、待ち時間が悪化する改正は、監視する目標で見つけ、そのつど判断する。D1
    の block_k の改正が C 社に損をさせていないかも、この評価方法で測り直す。
  by: human
- id: S6
  type: strategy
  text: '第 5 期: 変えない'
  ref: D5
  supported_by:
  - Sn5
  in_context_of:
  - C7
  - J7
- id: Sn5
  type: solution
  text: 同じシードで測った結果（p5-evidence.md）
  file: p5-evidence.md
- id: C7
  type: context
  text: '第 5 期の環境: 閑散期（注文の平均間隔 120 秒）'
- id: J7
  type: justification
  text: block_k を 3 に戻す案（1）と罰点をなくす案（3）は、効用の差を縮めるが、遅配が 1.8 件から 7.8 件・6.6 件に増え、最も低い会社の定時率も下がる。差を縮めるためにサービスを悪くすることはしない。罰点をなくす案は、道路の違反もほぼ倍になる。hold_limit
    の案（2）は C 社の効用を 1.3 しか上げず、最も待たせた会社の待ち時間の 95 パーセンタイルを、約束の 120 秒を超えた 178 秒からさらに 212
    秒に延ばす。C 社の効用が低い原因は、閑散期にもう一度測って考える。
  by: human
- id: S7
  type: strategy
  text: '第 6 期: 変えない'
  ref: D6
