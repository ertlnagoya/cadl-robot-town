  file: p1-evidence.md
- id: C2
  type: context
  text: 'Period 1 environment: normal (mean order interval 75 s)'
- id: J2
  type: justification
  text: 'I am deciding for the service operator, who owns the rules, the contract
    and the reading of the KPI, but not the regulation. Option 1 can only be adopted
    by revising the voting quorum, which is a regulation-level change for the regulator.
    Under K1''s process rule it needs an impact statement for A, B, C and the customers.
    The customer case for option 1 is strong: on-time 121.8 → 131.0 (+9.2, 5/5 seeds),
    late 10.4 → 1.2, lowest on-time rate 0.84 → 0.98, worst_company_p95_wait_s 273
    → 95.6. That is why I do not reject it on its merits. But overriding B''s and
    C''s votes now would set a lasting precedent that weakens every company''s veto
    on future amendments. Three costs also remain unexplained: C''s utility falls
    from 28.8 to 19.0 (about a third), B''s from 38.9 to 37.2, and road violations
    rise from 25.8 to 34.0, with unknown safety relevance for other road users. A
    one-period measurement on 5 seeds is not enough to justify an irreversible change
    to voting rights while those costs are not understood. I therefore keep v1 and
    do not follow the recommendation in this period. The vote result (A for, B and
    C against) stands. The proper next step is a narrowly scoped quorum-revision proposal
    sent to the regulator with the impact statement, together with measurement of
    why C loses and which violations increase. Customers keep the current service
    level for now; this is the cost of this choice and the reason to revisit it soon.
    Option 2 (hold_limit) is not a substitute: -1.2 on-time, 2/5 seeds.'
  by: llm
- id: A4
  type: assumption
