- id: J7
  type: justification
  text: 'I am deciding for the regulator. The only option is keep, and this decision
    answers R2.f1.


    Answer to R2.f1, part 1 (scoped quorum): In principle, yes. The regulator would
    accept a quorum revision confined to amendments that pass every KPI condition
    on all seeds and do not increase road violations. Such a rule would let customers
    gain without imposing an unexamined cost on third parties.


    Answer to R2.f1, part 2 (can the scope be written): Not with the instrument that
    exists today. vote.quorum is a single value of the constitution. A change to it
    applies to every future amendment, and nothing measured or written so far shows
    a way to condition it on measured outcomes. An amendment of the constitution also
    moves one parameter by one step. A conditional quorum would need a new kind of
    constitutional clause, and that is outside what can be proposed or measured now.


    The question is also moot for the candidate in hand. block_k 3 -> 2 has raised
    road violations in every measured period:

    - 25.8->34.0

    - 19.0->28.0

    - 24.2->34.8

    - 20.4->29.6

    In period 3 it improved only 3/5 seeds. It would not qualify under the scoped
    rule even if that rule existed.


    Answer to R2.f1, part 3 (accept block_k 2 once its violations are shown harmless):
    Not now. No by-cause breakdown of the violation increase exists, and none is scheduled
    by anyone in the town. Harmlessness therefore cannot be shown. Even if it were
    shown, the remaining override path is a blanket quorum cut. That would remove
    every company''s veto on all future amendments in order to pass one rule that
    B and C have rejected four times. Their utility losses are also unexplained:

    - C: 77.7 -> 68.8 in period 4.

    - B: 80.3 -> 76.0.

    I do not accept that trade.


    I record the customer cost. In period 4, customers forgo about 8.0 on-time deliveries
    (264.6 vs 272.6) and keep 10.0 late deliveries instead of 2.0.


    The regulator agrees with D4: the better route is a different single-parameter
    rule change that B and C can vote for and that does not raise road violations.
    constitution-v1 with vote.quorum 2 stays in force, and the vote results stand.'
  by: llm
