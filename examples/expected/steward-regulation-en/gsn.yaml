- id: G0
  type: goal
  text: The town keeps meeting the KPIs set by the human
  supported_by:
  - S1
- id: S1
  type: strategy
  text: Argue per version of the KPI
  supported_by:
  - G1
- id: G1
  type: goal
  text: 'KPI from period 1: Deliver as many orders as possible across the town within
    the times we promised customers. Leave no company''s customers behind. If the
    votes of the three companies or the conditions of the constitution (the invariants
    and the quorum) stand in the way of amendments that are good for customers, a
    revision of the regulation may be proposed. The regulation reaches all three companies
    and the customers, so say who is affected and how.'
  ref: K1
  in_context_of:
  - C1
  - J1
  - A1
  - A2
  - A3
  supported_by:
  - S2
  - S3
  - S4
  - S5
  - S6
  - S7
  - S8
  - S9
- id: C1
  type: context
  text: 'Measure (chosen by the human): main goal on_time_deliveries (increase), min_company_on_time_rate
    (increase), unfinished (decrease), worst_company_p95_wait_s (decrease)'
- id: J1
  type: justification
  text: 'The KPI''s first sentence makes the town-wide count of orders delivered within
    the promised times the primary objective, so on_time_deliveries should be the
    main goal. ''Leave no company''s customers behind'' protects customers, not parity
    between companies. Reading it as raising the floor (min_company_on_time_rate)
    is the reading that cannot be satisfied by making a better-served company''s customers
    worse off. Option 2''s gap metric could reward such levelling down. Option 3 would
    rank the town-wide count second, which contradicts the KPI''s stated priority.
    Monitoring unfinished and worst_company_p95_wait_s guards against the proxy problem:
    optimizing on-time counts could abandon orders that are already late, and those
    customers would be left behind. I accept the recommended option. No numeric levels
    are set because the KPI gives none. Regulation revisions remain a process rule:
    any such proposal goes to the human with an impact statement for A, B, C and the
    customers.'
  by: llm
- id: A1
  type: assumption
  text: The same seeds and order stream are used when comparing amendments, so on_time_deliveries
    and on_time_rate rank amendments the same way.
  by: llm
- id: A2
  type: assumption
  text: min_company_on_time_rate and worst_company_p95_wait_s are computed per company
    over that company's customers' orders.
  by: llm
- id: A3
  type: assumption
  text: '''Leave no company''s customers behind'' is meant to protect customers of
    the weakest company, not to equalize companies'' performance.'
  by: llm
- id: S2
  type: strategy
  text: 'Period 1: no change'
  ref: D1
  supported_by:
