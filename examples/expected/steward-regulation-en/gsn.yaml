- id: J5
  type: justification
  text: 'I am deciding for the service operator, who owns the rules, the contract
    and the KPI reading, but not the regulation. I follow the recommendation. Option
    1 passed check and the constitution, but B and C voted against it, so it is blocked
    1-2. The only override is a quorum change, which D2 and R2 declined.


    The evidence is weaker than in earlier periods, not stronger. On-time rises 213.6
    -> 219.4 (+5.8), but only 3/5 seeds improved, against 5/5 in periods 1 and 2.
    Road violations rise 24.2 -> 34.8 and still have no by-cause breakdown, so R2''s
    open question (are they harmless enforcement evictions?) is unanswered. R2''s
    reconsideration condition (every KPI condition on all seeds and no rise in road
    violations) is not met. C''s loss (58.3 -> 46.9, about 20%) and B''s loss (69.6
    -> 62.5) remain unexplained.


    The customer cost of keeping v1 is real, and I record it for the fourth period.
    Customers forgo about 5.8 on-time deliveries, keep late deliveries at 9.2 instead
    of 3.4, and the worst-served company''s customers wait p95 154 instead of 95.4.


    On D2.f1: its premise (improvement on all seeds) did not hold this period. So
    no, the operator will not ask the regulator for a scoped quorum revision now.


    On K1.d.f1: on_time_deliveries remains the main goal. min_company_on_time_rate
    and worst_company_p95_wait_s act as guards. An amendment that raises on-time but
    lowers the floor or raises the worst p95 does not count as a KPI improvement;
    it goes to the human with an impact statement for the customers of the worse-served
    company. No numeric per-company floor is set, because the KPI gives no number.
    Option 1 does not trigger this conflict, since it improves both guards.


    The vote result (A for, B and C against) stands.'
  by: llm
