  file: p3-evidence.md
- id: C4
  type: context
  text: 'Period 3 environment: busy (mean order interval 45 s)'
- id: J4
  type: justification
  text: 'I follow the LLM''s recommendation and stay at v2 (block_k 2). Option 1 improves
    on-time on 5/5 seeds: on-time 219.4 to 222.8 (+3.4), late 3.4 to 0.0, p95_wait_s
    93.2 to 56.8, blocked s 1217 to 121, lowest on-time rate 0.96 to 1.00. These are
    real service gains, but small. Service is already high under v2 (lowest on-time
    rate 0.96, unfinished 0.0). The costs are large. C''s utility would fall from
    46.9 to 21.4, more than half of it. Road violations, whose safety meaning is unknown,
    would rise from 34.8 to 40.0. They have already grown from 28.0, the level I accepted
    in D2 for one period on the condition that I would reconsider if they persisted
    or grew. They have grown, so relaxing blocking further now would contradict that
    condition. The D2 bar for overriding the companies was consistent multi-period
    customer gains. For block_k 2 to 1 there is only this one period''s measurement.
    The votes are A for, B for, C against, and I do not know whether the vote passes
    under the quorum rule. Even if it passes, I do not adopt it now: customers are
    not the only stakeholders whose safety may be at stake, and the gain of +3.4 orders
    does not outweigh a 54% loss to one company plus rising violations of unknown
    meaning. Keeping v2 means customers continue to bear about 3.4 late deliveries
    per period and a p95 wait of 93.2 s instead of 56.8 s. I accept this known cost
    for now. I am not rejecting further blocking relief permanently, but the violation
    trend under v2 must be addressed first. This decision does not settle D2.f2 (revert
    to block_k 3 or not); it stays open for period 4.'
  by: llm
- id: A11
  type: assumption
  text: Road violations may carry a real safety cost even though their meaning is
    unknown.
  by: llm
- id: A12
  type: assumption
  text: Next period's measurements under v2 will be comparable to this period's.
  by: llm
- id: A13
  type: assumption
  text: Keeping the current rule leaves the measured values of v2 unchanged under
    the same conditions.
  by: llm
- id: S5
  type: strategy
  text: 'Period 4: no change'
  ref: D4
  supported_by:
  - Sn4
  in_context_of:
  - C5
  - J5
  - A14
  - A15
  - A16
- id: Sn4
  type: solution
  text: Measured on the same seeds (p4-evidence.md)
  file: p4-evidence.md
- id: C5
  type: context
  text: 'Period 4 environment: busy + rush (mean order interval 45 s)'
- id: J5
  type: justification
  text: 'This settles D2.f2: I keep v2 (block_k 2) and do not revert to block_k 3.
    The revert worsens every customer measure. On-time falls from 272.6 to 264.6 (-8.0,
    0/5 seeds improved), late rises from 2.0 to 10.0, p95_wait_s rises from 90.0 to
    121, blocked s rises from 1102 to 1855, and the lowest on-time rate falls from
    0.98 to 0.93. It fails the improvement gate, and customers, who have no vote,
    would bear the whole cost. D2 and D3 set a condition: I would reconsider the revert
    if road violations persisted or grew. Under v2 they are 29.6 this period, down
    from 34.8 in period 3 and close to the 28.0 accepted in D2. The condition is therefore
    not triggered now, though violations remain above the pre-v2 level and their safety
    meaning is unknown. C''s utility under v2 is 68.8, its highest so far in these
    measurements, so the case for compensating C at customers'' expense is weaker
    than in D2. The revert would give C +8.9 and B +4.3 while costing A 5.2. B and
    C voted for it, but a company majority does not override a measured loss to customers
    on the KPI''s main goal. I follow the LLM''s recommendation. Violations should
    be addressed with a targeted rule rather than a blanket revert of blocking relief.
    Keeping v2 means road violations stay at 29.6 for now, which is an unknown safety
    cost I accept and will keep monitoring.'
  by: llm
- id: A14
  type: assumption
  text: Road violations at around 29.6 per period do not represent an immediate serious
    safety hazard.
  by: llm
- id: A15
  type: assumption
  text: This period's measurements are representative of the effect of block_k under
    busy + rush demand.
  by: llm
- id: A16
  type: assumption
  text: B and C will continue to operate normally despite another decision against
    their preference.
  by: llm
