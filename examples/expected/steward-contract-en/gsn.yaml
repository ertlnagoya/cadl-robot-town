- id: C6
  type: context
  text: 'Period 5 environment: quiet (mean order interval 120 s)'
- id: J6
  type: justification
  text: I follow the LLM's recommendation and keep v2 (block_k 2, hold_limit 60s).
    Option 1 worsens every customer measure. On-time falls from 80.8 to 80.2 (-0.6,
    0/5 seeds improved), late rises from 1.8 to 2.4, p95_wait_s rises from 116 to
    158, blocked s rises from 1046 to 1193, and the lowest on-time rate falls from
    0.96 to 0.95. In return, road violations fall only from 26.0 to 23.6, and their
    safety meaning is unknown. Under K1, a change that is worse for customers needs
    a measured customer justification, and there is none here. Customers have no vote
    and would bear the whole cost. My D2/D4 condition for acting on violations was
    that they persist or grow. Under v2 they are 26.0, below the 28.0 accepted in
    D2, the 29.6 accepted in D4 and the 34.8 of period 3, so the condition is not
    triggered. The company vote (A ○, B ×, C ○) does not change this. Even if it passes,
    a company majority does not justify a measured loss to customers on the main goal,
    and the change fails the on-time improvement gate. C forgoes +1.3 utility, but
    C is not in distress. My D4 request for a targeted violation rule was for a rule
    that does not shift the cost onto customers, and this one does. Keeping v2 means
    the 26.0 violations of unknown safety meaning remain. I accept that and will keep
    monitoring them. D4.f2 is not settled here because its trigger (violations above
    34.8) has not occurred.
  by: llm
- id: A17
  type: assumption
  text: Period 5 measurements under the same seeds are representative of the trade-off
    in other demand levels.
  by: llm
- id: A18
  type: assumption
  text: Road violations at 26.0 do not indicate an acute safety hazard.
  by: llm
- id: A19
  type: assumption
  text: No company will materially change behaviour because this change is rejected.
  by: llm
- id: S7
  type: strategy
  text: 'Period 6: no change'
  ref: D6
  supported_by:
  - Sn6
  in_context_of:
  - C7
  - J7
  - A20
  - A21
  - A22
- id: Sn6
  type: solution
  text: Measured on the same seeds (p6-evidence.md)
  file: p6-evidence.md
- id: C7
  type: context
  text: 'Period 6 environment: quiet (mean order interval 120 s)'
- id: J7
  type: justification
  text: 'I follow the LLM''s recommendation and stay at v2. Option 1 worsens every
    customer measure. On-time falls from 85.4 to 80.6 (-4.8, 0/5 seeds improved),
    so it fails the on-time improvement gate. Late rises from 2.0 to 6.8, p95_wait_s
    rises from 99.6 to 173, blocked s doubles from 903 to 1810, and the lowest on-time
    rate falls from 0.97 to 0.92. Under K1, a change that is worse for customers needs
    a measured customer justification, and there is none. Customers have no vote and
    would bear this whole cost. Road violations would rise from 28.2 to 50.0, far
    above the 34.8 level I set in D3/D4 as the trigger for reconsideration, and the
    sanction would no longer deter them.


    The company vote (A ×, B ○, C ○) does not change this. Even if it passes, a company
    majority does not justify a measured loss to customers on the main goal plus a
    near-doubling of violations of unknown safety meaning.


    C''s distress is real. Its utility of 10.5 is far below A and B (26.8 each), and
    unlike in D4 and D5 I do not dismiss it. But removing the sanction entirely moves
    the cost of C''s relief onto customers and road safety. Relief should come from
    a targeted change, such as a partial sanction reduction or a fix to the cause
    of C''s penalties. Neither was measured, and this is the last period.


    Keeping v2 means C continues to carry a disproportionate penalty burden. I accept
    that cost knowingly, and I record it as an unresolved fairness problem.


    This also settles D4.f2. Violations under v2 are 28.2, below 34.8, so the trigger
    has not occurred. My answer for the record is yes: if violations under v2 rose
    above 34.8, a violation-reducing rule change should be preferred even at some
    measured cost to on-time deliveries. The condition is that the cost is small,
    measured, and the change does not alter the contract. Option 1 is the opposite
    case: it raises violations and also costs customers.'
  by: llm
