nodes:
- id: G0
  type: goal
  text: The town keeps meeting the KPIs set by the human
  supported_by:
  - S1
- id: S1
  type: strategy
  text: Argue per version of the KPI
  supported_by:
  - G1
- id: G1
  type: goal
  text: 'KPI from period 1: Deliver as many orders as possible across the town within
    the times we promised customers. The promised times (from order to pickup, and
    from pickup to delivery) may be revised if that is better than keeping promises
    we cannot keep. A change that is worse for customers needs a reason, given after
    measuring its effect on them.'
  ref: K1
  in_context_of:
  - C1
  - J1
  - A1
  - A2
  - A3
  supported_by:
  - S2
  - S3
  - S4
  - S5
  - S6
  - S7
- id: C1
  type: context
  text: 'Measure (chosen by the human): main goal on_time_deliveries (increase), p95_wait_s
    (decrease), unfinished (decrease), late_deliveries (decrease)'
- id: J1
  type: justification
  text: The KPI literally asks to deliver as many orders as possible within the promised
    times, so on_time_deliveries is the faithful primary goal. The KPI also allows
    revising the promised times and requires that customer-worsening changes be justified
    by their measured effect on customers. Option 1 meets that requirement by monitoring
    SLA-independent measures (p95_wait_s, unfinished) alongside late_deliveries. Option
    2 would guard against gaming but would reject rule changes the KPI wants, those
    that raise the on-time count at a small cost in tail wait. The gaming risk is
    better handled by the rule that every SLA change is decided by a human after customer
    impact (p95_wait_s, max_wait_s, unfinished) has been reported. No measurements
    exist yet (period 1), so no table values are cited. No numeric targets or guards
    are set because the KPI states none. I follow the LLM's recommendation.
  by: llm
- id: A1
  type: assumption
  text: Order volume is the same across runs with the same seed and demand, so on_time_deliveries
    and on_time_rate rank options the same way.
  by: llm
- id: A2
  type: assumption
  text: p95_wait_s and unfinished are measured independently of the SLA thresholds.
  by: llm
- id: A3
  type: assumption
  text: Any DELIVERY_SLA proposal will report p95_wait_s, max_wait_s and unfinished
    before a human decides.
  by: llm
- id: S2
  type: strategy
  text: 'Period 1: no change'
  ref: D1
  supported_by:
  - Sn1
  in_context_of:
  - C2
  - J2
  - A4
  - A5
  - A6
- id: Sn1
  type: solution
  text: Measured on the same seeds (p1-evidence.md)
  file: p1-evidence.md
- id: C2
  type: context
  text: 'Period 1 environment: normal (mean order interval 75 s)'
- id: J2
  type: justification
  text: 'Option 1 is clearly the best for the KPI and for customers. on_time_deliveries
    rises from 121.8 to 131.0 (+9.2, 5/5 seeds), late_deliveries falls from 10.4 to
    1.2, and p95_wait_s falls from 188 to 81.4. However, the companies'' vote is one
    of the machine judgments, and B and C rejected it. C would lose heavily (utility
    28.8 -> 19.0) and B slightly (38.9 -> 37.2), while road violations rise from 25.8
    to 34.0. As a delegate, I do not think I should override a failed company vote
    that takes about a third of one company''s utility in the first period, before
    anyone has tried to win B and C''s agreement. I am rejecting the recommendation
    for now, not discarding option 1. I reject option 2 although all three companies
    voted for it, because customers do not vote. Its gain is only +0.8 (122.6 vs 121.8)
    on 3/5 seeds. blocked s stays at 2404 and p95_wait_s stays at 188, so the gain
    comes from redefining ''on time'', not from serving customers faster. Under K1,
    a customer-worsening contract change must be justified by its measured effect
    on customers, and this one is not. This settles K1.d.f1: the first SLA change
    is not justified. For now I set no numeric wait limit beyond requiring that any
    SLA relaxation must not worsen p95_wait_s, max_wait_s or unfinished, and must
    show real service gains. Keeping v1 keeps on-time 121.8, late 10.4 and p95 188
    for one more period. That is a known cost to customers, which I accept so that
    option 1 can be revisited with an explicit decision on the vote.'
  by: llm
- id: A4
  type: assumption
  text: The current v1 results (on-time 121.8, late 10.4, p95_wait_s 188) will roughly
    persist next period under similar demand.
  by: llm
- id: A5
  type: assumption
  text: B and C's objection is mainly about their own utility loss, which a later
    agreement or override decision could address.
  by: llm
- id: A6
  type: assumption
  text: A one-period delay in adopting block_k 2 does not cause irreversible harm
    to customers.
  by: llm
- id: S3
  type: strategy
  text: 'Period 2: v2 block_k 3 → 2 (rule, main goal +7.2, yes: A); adopted against
    the vote'
  ref: D2
  supported_by:
  - Sn2
  in_context_of:
  - C3
  - J3
  - A7
  - A8
  - A9
  - A10
- id: Sn2
  type: solution
  text: Measured on the same seeds (p2-evidence.md)
  file: p2-evidence.md
- id: C3
  type: context
  text: 'Period 2 environment: normal + rush (mean order interval 75 s)'
- id: J3
  type: justification
  text: 'This settles D1.f2: I adopt block_k 3 → 2 over the votes of B and C (A ○,
    B ×, C ×). The customer gain is now measured in two periods under different demand.
    In period 1 on-time rose by +9.2 on 5/5 seeds. Now on-time rises from 216.6 to
    223.8 (+7.2, 5/5 seeds), late falls from 11.4 to 4.2, p95_wait_s falls from 138
    to 110 and blocked s falls from 1824 to 936. The lowest on-time rate rises from
    0.93 to 0.97 and unfinished stays at 0.0. These are real service gains: blocked
    time halves and the contract is unchanged, so ''on time'' is not being redefined.
    This is what the KPI (K1) asks for. Customers have no vote and have already borne
    the known cost of about 7 extra late deliveries per period once. In D1 I accepted
    that cost on purpose, so that the vote question could be decided explicitly. Repeating
    it would make the company vote a standing veto over customer service. C''s loss
    has fallen from about a third of its utility in period 1 to about 14% now (65.8
    → 56.3), and B''s is small (68.5 → 65.5). This is a real cost and I weigh it seriously,
    but it is smaller than the customer gain on the KPI''s main goal. The main reservation
    is road violations rising from 19.0 to 28.0. I do not know their safety meaning.
    I accept this for one period and will reconsider reverting if it persists or grows.
    This is not a permanent licence to override votes: the override is limited to
    a change with consistent multi-period customer gains and no contract change. Option
    2 (hold_limit 60s → 50s) is not offered here. Its gain of +0.4 on 2/5 seeds would
    not justify anything in any case.'
  by: llm
- id: A7
  type: assumption
  text: The measured gains under identical seeds carry over to the next period's actual
    demand.
  by: llm
- id: A8
  type: assumption
  text: The rise in road violations from 19.0 to 28.0 is about parking and eviction
    rules, not collisions or dangers to other road users.
  by: llm
- id: A9
  type: assumption
  text: B and C will not change their robot policies in ways that erase the gain within
    one period.
  by: llm
- id: A10
  type: assumption
  text: The constitution and process permit an operator decision to adopt a rule change
    whose company vote failed.
  by: llm
- id: S4
  type: strategy
  text: 'Period 3: no change'
  ref: D3
  supported_by:
  - Sn3
  in_context_of:
  - C4
  - J4
  - A11
  - A12
  - A13
