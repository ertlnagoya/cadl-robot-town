- id: C2
  type: context
  text: '第 1 期の環境: 平常（注文の平均間隔 75 秒）'
- id: J2
  type: justification
  text: 私はサービスの運営者に代わって判断しますが、運営者が決められるのは規則と契約です。案 1（block_k 3 → 2）は、定時配達を 121.8 から
    131.0（+9.2、5/5 シードで改善）に増やし、遅配を 10.4 から 1.2 に、min_company_on_time_rate を 0.84 から
    0.98 に、worst_company_p95_wait_s を 273 から 95.6 に、max_wait_s を 385 から 245 に改善します。KPI
    の評価方法では最もよい案です。しかし投票は A ○、B ×、C × で否決されています。採択するには定足数という規制の層を変える必要があり、それは規制の担当者が決めることです。運営者の立場で投票の結果を覆すことはできないので、この判断では案
    1 を選びません。案 1 を規制の見直しで採るかどうかは、規制の担当者に問いとして残します。そのときには次の点を示します。C 社の効用は 28.8 から 19.0
    に大きく下がり、B 社も 38.9 から 37.2 に下がります。道路の違反は 25.8 から 34.0 に増えます。定足数を変えると、今後の改正でも反対する会社が採択を止められなくなります。案
    3（pickup_deadline 120s → 150s）は 3 社が賛成していますが、定時配達は +0.8 で改善は 3/5 シードにとどまります。ふさがれた秒
    2404、worst_company_p95_wait_s 273、max_wait_s 385 は変わりません。実際の待ち時間は短くならず、顧客への集荷の約束を
    120 秒から 150 秒に緩めることで数値だけが良くなります。KPI の意図は約束の時間内に届く配達を実際に増やし、どの会社の顧客も取り残さないことなので、案
    3 はこの意図に合いません。顧客は投票に加われず、約束が緩むことで損をするので、顧客の利害を守るため契約は変えません。以上から、この期は現行 v1 のままにします。LLM
    の推奨（案 1）と違う選択ですが、それは案 1 の効果を否定するからではありません。案 1 の採否が規制の担当者の判断に属するからです。
  by: llm
- id: A4
  type: assumption
  text: 測った結果の表の値は、次の期の平常の需要でもおおむね成り立つ。
  by: llm
- id: A5
  type: assumption
  text: 規制（定足数）の変更は運営者ではなく規制の担当者の権限であり、運営者に代わる判断で投票の結果を覆すことはできない。
  by: llm
- id: A6
  type: assumption
