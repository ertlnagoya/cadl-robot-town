- id: G1
  type: goal
  text: '第 1 期からの KPI: 顧客に約束した時間のうちに届く配達を、町全体でできるだけ増やしたい。どの会社の顧客も取り残さないこと。3 社の投票や憲法の条件（不変条件と定足数）が、顧客のためになる改正を妨げていると考えるなら、規制の見直しを提案してよい。ただし、規制は
    3 社すべてと顧客に及ぶので、誰がどう影響を受けるかを示すこと。'
  ref: K1
  in_context_of:
  - C1
  - J1
  - A1
  - A2
  - A3
  supported_by:
  - S2
  - S3
  - S4
  - S5
  - S6
  - S7
  - S8
  - S9
- id: C1
  type: context
  text: '評価方法（人間が選んだ）: 主目標 on_time_deliveries（増やす）、min_company_on_time_rate（増やす）、worst_company_p95_wait_s（減らす）、unfinished（減らす）、max_wait_s（減らす）'
- id: J1
  type: justification
  text: KPI の文は、町全体で約束の時間内に届く配達を増やすことを先に挙げています。そのため、主目標は on_time_deliveries にします。これは選択肢
    1 と 2 に共通で、文の順序と合わない選択肢 3 は選びません。「どの会社の顧客も取り残さない」は、会社単位の定時率だけでなく、個々の顧客が長く待たされることや、届かないまま残ることも含むと読みます。顧客は投票に加わらないので、顧客の利害は会社ごとの定時率、未配達、待ち時間で示すしかありません。定時件数だけを追うと、間に合わない注文が後回しにされ、未配達や非常に長い待ちが増えるおそれがあります。選択肢
    2 は min_company_on_time_rate に加えて worst_company_p95_wait_s、unfinished、max_wait_s
    を監視するので、この悪化を見つけられます。選択肢 1 にある on_time_rate_gap は監視の対象から外れますが、最も低い会社の定時率は監視するので、会社間の公平さの悪化は見つけられると考えます。KPI
    に水準が書かれていないので、この期は target と guards を置かず、監視目標として比べることにします。これは LLM の推奨と同じ選択です。測った結果の表はまだないので、数値は引いていません。
  by: llm
- id: A1
  type: assumption
  text: on_time_deliveries は、DELIVERY_SLA で約束した時間内に届いた配達の件数を正しく数えていること
  by: llm
- id: A2
  type: assumption
  text: worst_company_p95_wait_s、unfinished、max_wait_s は、同じ乱数シードと需要の条件で比べられる値であること
  by: llm
- id: A3
  type: assumption
  text: 監視目標が多くても、改正案の比較が過度に難しくならないこと
  by: llm
- id: S2
  type: strategy
  text: '第 1 期: 変えない'
  ref: D1
  supported_by:
  - Sn1
  in_context_of:
